name: Build Cache [using jupyter-book]
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Anaconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          auto-activate: true
          miniconda-version: 'latest'
          python-version: "3.13"
          environment-file: environment.yml
          activate-environment: quantecon
      - name: Install JAX (CPU, pinned)
        shell: bash -l {0}
        run: |
          # Pinned to the lecture baseline, QuantEcon/lectures'
          # _base/environment-update.yml, as in the English edition. jax 0.11.1
          # hung numpy_vs_numba_vs_jax's lax.fori_loop cells on the CPU path
          # (QuantEcon/workspace-lectures#49); 0.12.1 runs them. The lecture's
          # own install cell names the same version, so it is satisfied and
          # reinstalls nothing.
          pip install "jax==0.12.1"
      - name: Build HTML
        shell: bash -l {0}
        run: |
          jb build lectures --path-output ./ --keep-going
          # TODO: Re-enable -W flag once all lectures are translated and warnings are resolved
      - name: Upload Execution Reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: execution-reports
          path: _build/html/reports
      - name: Upload "_build" folder (cache)
        uses: actions/upload-artifact@v7
        with:
          name: build-cache
          path: _build
          include-hidden-files: true